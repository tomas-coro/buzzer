  app(cap2, el("span", null, "Prima del via"), el("b", null, "Come si vince"));
  dx.appendChild(cap2);

  const brief = el("div", "v-brief");
  [["Avversario", avvCompleto()], ["Coach", g.coach], ["Tattica", g.tattica],
   ["Minuti panchina", g.mio.filter((c) => c.tipo === "riserva").reduce((a, c) => a + c.minuti, 0) + "'"],
  ].forEach(([k, v]) => {
    const r = el("div", "r");
    app(r, el("span", null, k), el("b", null, String(v)));
    brief.appendChild(r);
  });
  dx.appendChild(brief);

  const capD = el("div", "sh-cap");
  app(capD, el("span", null, "Il duello dei reparti"), el("b", null, "Perché finisce così"));
  dx.appendChild(capD);
  dx.appendChild(duelloReparti(g));

  const note = el("ul", "v-note");
  const li = el("li");
  li.innerHTML = "Le carte si vedono <b>solo qui</b>: al fischio d'inizio diventano le righe del tabellino, " +
    "e da lì in poi contano i numeri, non i ritratti.";
  note.appendChild(li);
  dx.appendChild(note);

  const capL = el("div", "sh-cap");
  app(capL, el("span", null, "Chi hai di fronte"), el("b", null, nomeAvv() + " · quintetto"));
  dx.appendChild(capL);
  const loro = el("div", "v-loro");
  g.loro.filter((c) => c.tipo !== "riserva").forEach((c) => {
    const r = el("div", "r");
    app(r, el("span", "ru", c.ruolo), el("span", "nm", cognome(c.nome)), el("span", "ov", String(c.ovr)));
    loro.appendChild(r);
  });
  dx.appendChild(loro);

  const cta = el("button", "sh-cta giu", "Palla a due");
  cta.onclick = () => { state.vista = "D"; riavvolgi(); via(); };
  dx.appendChild(cta);
  grid.appendChild(dx);

  body.appendChild(grid);
  root.appendChild(body);
}

// I cinque reparti su cui gira game/partita.js, tuoi contro loro.
function duelloReparti(g) {
  const REP = [["t3", "Tiro da tre"], ["fin", "Finalizzazione"], ["dif", "Difesa"],
    ["reb", "Rimbalzo"], ["reg", "Regia"]];
  const media = (rosa, k) => Math.round(
    rosa.filter((c) => c.tipo !== "riserva").reduce((a, c) => a + c.reparti[k], 0) /
    rosa.filter((c) => c.tipo !== "riserva").length);
  const w = el("div", "sh-duel");
  const head = el("div", "head");
  app(head, el("span", null, nomeMio()), el("span", null, nomeAvv()));
  w.appendChild(head);
  for (const [k, lab] of REP) {
    const mio = media(g.mio, k), loro = media(g.loro, k);
    const r = el("div", "r");
    const sx = el("div", "side sx");
    const b1 = el("div", "bar"); app(b1, el("i")).firstChild.style.width = mio + "%";
    app(sx, el("div", "val" + (mio >= loro ? " win" : ""), String(mio)), b1);
    const dx = el("div", "side dx");
    const b2 = el("div", "bar"); app(b2, el("i")).firstChild.style.width = loro + "%";
    app(dx, el("div", "val" + (loro > mio ? " win" : ""), String(loro)), b2);
    app(r, sx, el("div", "lab", lab), dx);
    w.appendChild(r);
  }
  return w;
}

/* ========================== SCHERMATA: TABELLINO ========================== */
function vistaTabellino(root) {
  root.appendChild(header());
  const body = el("div", "sh-body");
  const g = P();
  // Il tabellino è quello di fine partita, sempre: qui non si guarda un
  // momento, si guarda il risultato.
  const righe = tabellinoAl(g.azioni.length - 1);
  const wrap = el("div", "t-wrap");

  const top = el("div", "t-top");
  const alto = el("div", "sh-panel");
  const salva = state.k; state.k = g.azioni.length - 1;
  app(alto, scoreline(), tabellaQuarti(), verdetto());
  state.k = salva;
  // Sotto il verdetto la cronaca del motore, una riga per quarto: dice come si
  // è arrivati a quel punteggio senza rileggere trecento azioni.
  const capCr = el("div", "sh-cap");
  app(capCr, el("span", null, "Come è andata"), el("b", null, "Quarto per quarto"));
  alto.appendChild(capCr);
  const cr = el("ul", "t-cronaca");
  g.cronaca.forEach((c) => {
    const li = el("li");
    app(li, el("b", null, c.quarto), el("span", null, c.testo));
    cr.appendChild(li);
  });
  alto.appendChild(cr);
  top.appendChild(alto);

  const pan = el("div", "sh-panel t-side");
  const cap = el("div", "sh-cap");
  app(cap, el("span", null, "Migliore in campo"), el("b", null, "Della partita"));
  pan.appendChild(cap);
  const tutte = [...righe.casa.map((r) => ({ ...r, lato: "casa" })),
    ...righe.ospite.map((r) => ({ ...r, lato: "ospite" }))];
  const mvp = tutte.slice().sort((a, b) => b.pts - a.pts)[0];
  const box = el("div", "t-mvp");
  const f = el("div", "sh-face");
  const [t1, t2] = tinta(mvp.lato === "casa" ? 0 : 3);
  f.style.setProperty("--tc1", t1); f.style.setProperty("--tc2", t2);
  app(f, el("div", "ini", iniziali(mvp.carta.nome)));
  const who = el("div", "who");
  app(who, el("div", "n", mvp.carta.nome),
    el("div", "s", (mvp.carta.teamNome || mvp.carta.team) + " " + mvp.carta.stagione +
      (mvp.lato === "casa" ? " · " + nomeMio() : "")));
  const line = el("div", "line");
  line.innerHTML = mvp.pts + '<i>PT</i>' + mvp.reb + '<i>RIMB</i>' + mvp.ast + '<i>AST</i>' +
    mvp.fgm + "/" + mvp.fga + '<i>dal campo</i>';
  who.appendChild(line);
  app(box, f, who);
  pan.appendChild(box);

  const capC = el("div", "sh-cap");
  app(capC, el("span", null, "Le cifre della partita"), el("b", null, "Tu · loro"));
  pan.appendChild(capC);
  pan.appendChild(cifre(righe));

  const nota = el("p", "sh-nota");
  nota.innerHTML = "La colonna <b>FALLI</b> è quella del motore. In diretta conta solo i falli che " +
    "mandano in lunetta, perché sono gli unici a cui il racconto sa dare un nome.";
  pan.appendChild(nota);
  top.appendChild(pan);
  wrap.appendChild(top);

  // A fine partita le colonne si vedono TUTTE: qui non serve scegliere, c'è
  // spazio in larghezza e questo è il momento in cui si guardano le percentuali.
  [["casa", nomeMio()], ["ospite", avvCompleto()]].forEach(([lato, lab]) => {
    const p = el("div", "sh-panel");
    const c = el("div", "sh-cap");
    app(c, el("span", null, lato === "casa" ? "Il tuo tabellino" : "Il loro tabellino"),
      el("b", null, lab));
    p.appendChild(c);
    p.appendChild(tabellaPiena(righe[lato], lato));
    wrap.appendChild(p);
  });

  body.appendChild(wrap);
  root.appendChild(body);
}

// Le quattro cifre che spiegano il risultato meglio del punteggio: come hanno
// tirato le due squadre e quante palle hanno buttato via.
function cifre(righe) {
  const somma = (lato, k) => righe[lato].reduce((a, r) => a + r[k], 0);
  const pct = (f, t) => (t === 0 ? "-" : Math.round((f / t) * 100) + "%");
  const voci = [
    ["Dal campo", (l) => somma(l, "fgm") + "/" + somma(l, "fga") + " · " + pct(somma(l, "fgm"), somma(l, "fga"))],
    ["Da tre", (l) => somma(l, "tpm") + "/" + somma(l, "tpa") + " · " + pct(somma(l, "tpm"), somma(l, "tpa"))],
    ["Liberi", (l) => somma(l, "ftm") + "/" + somma(l, "fta") + " · " + pct(somma(l, "ftm"), somma(l, "fta"))],
    ["Rimbalzi", (l) => String(somma(l, "reb"))],
    ["Palle perse", (l) => String(somma(l, "tov"))],
  ];
  const w = el("div", "t-cifre");
  for (const [lab, f] of voci) {
    const r = el("div", "r");
    app(r, el("span", "a", f("casa")), el("span", "k", lab), el("span", "b", f("ospite")));
    w.appendChild(r);
  }
  return w;
}

// Tabellino completo: base + tiro nella stessa tabella. Sta in piedi solo a
// larghezza piena, quindi vive solo qui.
function tabellaPiena(righe, lato) {
  const g = P();
  const cols = [...COL_BASE, { f: ["fgm", "fga"], h: "TIRI" }, { f: ["tpm", "tpa"], h: "3PT" },
    { f: ["ftm", "fta"], h: "TL" }, { k: "pf", h: "FALLI" }];
  // I falli veri sono quelli del motore, non quelli nominati nel log.
  const conFalli = righe.map((r, i) => ({ ...r, pf: g.falli[lato][i] }));
  return tabella(conFalli, lato, "piena", cols);
}

/* ---- controllo: il mockup deve dire il vero -------------------------------
   Somma le azioni fino all'ultima e confronta con quello che dice il motore.
   Punteggio e tiri devono coincidere al numero. Assist, recuperi e stoppate
   possono restare INDIETRO (il log non ha sempre un canestro o un possesso a cui
   appoggiarli) ma non devono mai superare il box score. */
function controllo() {
  const problemi = [];
  const salvaP = state.partita, salvaK = state.k;
  window.PARTITE.forEach((g, i) => {
    state.partita = i;
    const righe = tabellinoAl(g.azioni.length - 1);
    for (const lato of ["casa", "ospite"]) {
      const punti = righe[lato].reduce((a, r) => a + r.pts, 0);
      if (punti !== g.punti[lato]) problemi.push(`${g.scenario}/${lato}: punti ${punti} invece di ${g.punti[lato]}`);
      righe[lato].forEach((r, j) => {
        const tiri = g.tiri[lato][j];
        for (const k of ["fgm", "fga", "tpm", "tpa", "ftm", "fta"]) {
          if (r[k] !== tiri[k]) problemi.push(`${g.scenario}/${lato}/${r.carta.nome}: ${k} ${r[k]} invece di ${tiri[k]}`);
        }
        for (const k of ["ast", "stl", "blk"]) {
          if (r[k] > g.box[lato][j].tot[k]) {
            problemi.push(`${g.scenario}/${lato}/${r.carta.nome}: ${k} ${r[k]} sopra il box score ${g.box[lato][j].tot[k]}`);
          }
        }
      });
    }
  });
  state.partita = salvaP; state.k = salvaK;
  const chip = document.getElementById("mk-esito");
  if (problemi.length === 0) {
    chip.textContent = "torna col motore";
    chip.classList.remove("ko");
  } else {
    chip.textContent = problemi.length + " scarti";
    chip.classList.add("ko");
    console.error("Il mockup non torna col motore:", problemi);
  }
}

/* ---- render -------------------------------------------------------------- */
function render() {
  const root = document.getElementById("screen");
  root.textContent = "";
  if (state.vista === "V") vistaPrimaDelVia(root);
  else if (state.vista === "T") vistaTabellino(root);
  else vistaDiretta(root);

  document.getElementById("mk-title").textContent =
    state.vista === "V" ? "Prima del via" : state.vista === "T" ? "Tabellino" : "Diretta";
  document.getElementById("mk-desc").textContent = DESC[state.vista];
  document.querySelectorAll("[data-vista]").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.vista === state.vista));
  });
  document.querySelectorAll("[data-scenario]").forEach((b) => {
    b.setAttribute("aria-pressed", String(Number(b.dataset.scenario) === state.partita));
  });
}

/* ---- avvio --------------------------------------------------------------- */
if (!window.PARTITE || !window.PARTITE.length || !window.PARTITE[0].azioni) {
  document.getElementById("screen").appendChild(el("div", "sh-empty",
    "Manca 78-partita-data.js con le azioni. Si rigenera con: node tools/dati-tabellone.mjs --azioni > mockups/78-partita-data.js"));
} else {
  window.PARTITE.forEach(preparaBadge);
  state.squadra = (window.PROFILO && window.PROFILO.squadra) || "Dinamo Sofà";

  const sc = document.getElementById("mk-scenari");
  sc.appendChild(el("span", "mk-lbl", "Scenario"));
  window.PARTITE.forEach((g, i) => {
    const b = el("button", "mk-chip", g.scenario + " " + g.punti.casa + "-" + g.punti.ospite);
    b.dataset.scenario = String(i);
    b.setAttribute("aria-pressed", String(i === state.partita));
    b.onclick = () => { state.partita = i; riavvolgi(); };
    sc.appendChild(b);
  });
  // Esc chiude la scheda del giocatore: è il gesto che tutti provano per primo.
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && state.scheda) { e.preventDefault(); chiudiScheda(); }
  });
  document.querySelectorAll("[data-vista]").forEach((b) => {
    b.onclick = () => {
      state.vista = b.dataset.vista;
      if (state.vista !== "D") stop();
      if (state.vista === "V") { state.k = -1; logCache = null; }
      render();
    };
  });

  controllo();
  render();
}
