<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>83 - esito, frame telefono</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Bodoni+Moda:ital,opsz,wght@0,6..96,600;0,6..96,700;1,6..96,600&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Bungee&family=Doto:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../prototype/imbattuto/styles.css">
<style>
  /* Questo file gira in un iframe largo esattamente quanto un telefono, così
     le unità vw del CSS di produzione (es. 14vw sul titolo) si calcolano sulla
     larghezza vera del telefono - non su quella larga del laboratorio attorno. */
  html, body { background: var(--ink); }
  body { margin: 0; padding: 0; }
  #app { padding: 20px 18px 22px; }

  .screen.esito { position: relative; overflow: hidden; }

  /* ---- flash comune (riuso ricetta home .flash) ---- */
  .e-flash {
    position: absolute; left: 50%; top: 86px; width: 320px; height: 320px; border-radius: 50%;
    transform: translate(-50%, -50%) scale(.6);
    background: radial-gradient(circle, rgba(255,207,51,0) 24%, rgba(255,176,46,.5) 45%, rgba(255,91,30,.28) 60%, transparent 74%);
    opacity: 0; pointer-events: none; mix-blend-mode: screen; z-index: 0;
  }
  .esito.lose .e-flash { background: radial-gradient(circle, rgba(255,80,56,0) 24%, rgba(255,80,56,.32) 45%, rgba(255,80,56,.18) 60%, transparent 74%); }

  #score { position: relative; z-index: 1; width: 100%; font-family: var(--led); font-weight: 900; font-size: 2.3rem; letter-spacing: .02em; color: var(--bone-dim); text-align: center; margin: 2px 0 0; }
  #score b { color: var(--yellow); }
  .esito.lose #score b { color: var(--red); }

  /* Font-size scoping su #title: la regola reale ".esito h1" (styles.css, già
     usata da Draft/Coach/Run) ha specificità (0,1,1) e altrimenti la batte -
     lezione già in memoria coi collisioni .r/.flash. Un id vince su class+tag. */
  #title { position: relative; z-index: 1; width: 100%; font-family: var(--arcade); font-size: clamp(1.7rem, 10.5vw, 2.6rem); text-align: center; margin: 8px 0 0; letter-spacing: -.01em; opacity: 0; white-space: nowrap; }
  .esito.win #title { color: var(--brass); }
  .esito.lose #title { color: var(--ko); }
  #title::after { content: ""; display: block; width: 56px; height: 4px; margin: 12px auto 0; border-radius: 2px; }
  .esito.win #title::after { background: var(--brass); }
  .esito.lose #title::after { background: var(--ko); }

  #riepilogo { position: relative; z-index: 1; width: 100%; font-family: var(--serif); font-style: italic; font-size: .96rem; color: var(--bone-dim); text-align: center; margin: 10px 0 20px; opacity: 0; }

  /* ---- beacon direzione C ---- */
  #beacon { position: relative; z-index: 1; width: 20px; height: 20px; border-radius: 50%; margin: 0 auto 8px; background: var(--ink-3); border: 1px solid var(--line); opacity: 0; }
  .esito.win #beacon.settled { background: var(--green); box-shadow: 0 0 16px rgba(92,207,142,.7); border-color: transparent; }
  .esito.lose #beacon.settled { background: var(--red); box-shadow: 0 0 16px rgba(255,80,56,.5); border-color: transparent; }

  /* ---- ladder direzione B (16 tacche) ---- */
  #ladder { position: relative; z-index: 1; width: 100%; display: flex; gap: 3px; justify-content: center; margin: 0 0 14px; flex-wrap: wrap; opacity: 0; }
  .e-tacca { width: 15px; height: 8px; border-radius: 2px; background: var(--ink-3); border: 1px solid var(--line); }
  .e-tacca.lit { background: var(--yellow); border-color: var(--yellow); box-shadow: 0 0 6px rgba(255,207,51,.6); }
  .esito.lose .e-tacca.lit { background: var(--red); border-color: var(--red); box-shadow: 0 0 6px rgba(255,80,56,.5); }

  /* righe round - .storia riusa il nome reale (stessa forma finale voluta),
     ma la regola reale ".storia li" impone display:flex + padding: qui li
     serve invece impilati (riga + dettaglio), quindi le ridichiaro tutte. */
  #storia { position: relative; z-index: 1; width: 100%; opacity: 0; }
  #storia li { display: flex; flex-direction: column; padding: 0; background: var(--ink); }
  .r-row { display: flex; align-items: center; gap: 9px; padding: 10px 11px; cursor: pointer; }
  .r-fascia { flex: none; width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-family: var(--led); font-weight: 900; font-size: .76rem; }
  .r-fascia.oro { background: rgba(255,207,51,.14); color: var(--yellow); border: 1px solid rgba(255,207,51,.4); }
  .r-fascia.argento { background: rgba(180,186,224,.12); color: #c7cbe8; border: 1px solid rgba(180,186,224,.3); }
  .r-fascia.bronzo { background: rgba(255,91,30,.12); color: var(--brass); border: 1px solid rgba(255,91,30,.35); }
  .r-fascia.rosso { background: rgba(255,80,56,.14); color: var(--red); border: 1px solid rgba(255,80,56,.4); }
  .r-mid { flex: 1; min-width: 0; }
  .r-avv { display: block; font-weight: 700; font-size: .8rem; color: var(--bone); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r-clou { display: block; font-size: .68rem; color: var(--bone-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .r-pt { flex: none; font-family: var(--led); font-weight: 900; font-size: .8rem; color: var(--bone-dim); text-align: right; }
  .r-round { flex: none; font-size: .58rem; color: var(--bone-dim); letter-spacing: .07em; text-transform: uppercase; min-width: 26px; }
  .r-detail { max-height: 0; overflow: hidden; transition: max-height .25s var(--ease); border-top: 1px solid var(--line); }
  #storia li.open .r-detail { max-height: 140px; }
  .r-detail-in { padding: 10px 11px 12px; font-size: .72rem; color: var(--bone-dim); }
  .r-quarti { display: flex; gap: 6px; margin: 0 0 8px; font-family: var(--led); font-variant-numeric: tabular-nums; }
  .r-quarti span { flex: 1; text-align: center; background: var(--ink-2); border-radius: 6px; padding: 4px 0; font-size: .64rem; color: var(--bone); }
  .r-clou-full { margin: 0; line-height: 1.4; text-wrap: pretty; }
  .r-clou-full b { color: var(--yellow); }

  .azioni { position: relative; z-index: 1; width: 100%; opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    .e-flash, #title, #riepilogo, #beacon, #ladder, #storia, .azioni { animation: none !important; opacity: 1 !important; }
  }
</style>
</head>
<body>
<main id="app">
  <section class="screen esito win" id="esito">
    <div class="e-flash" id="flash"></div>
    <div id="ladder" hidden></div>
    <div id="beacon" hidden></div>
    <p id="score"><b>0</b>-0</p>
    <h1 id="title">IMBATTUTO</h1>
    <p id="riepilogo">16 vittorie di fila</p>
    <ul class="storia" id="storia"></ul>
    <div class="azioni">
      <button class="cta" id="lb-cta">Leaderboard</button>
      <button class="chip" id="ancora-chip">Nuovo run</button>
    </div>
  </section>
</main>

<script>
// Punteggi finali sempre coerenti (tuo > loro nei round vinti: nel motore
// reale solo l'ULTIMO round di un run può essere una sconfitta).
const ROUND_WIN = [
  { avv: "Warriors '15-16", tuo: 96, loro: 79 },   // 17 -> oro
  { avv: "Cavaliers '15-16", tuo: 91, loro: 84 },  // 7  -> bronzo
  { avv: "Spurs '15-16", tuo: 90, loro: 88 },      // 2  -> bronzo
  { avv: "Thunder '15-16", tuo: 97, loro: 81 },    // 16 -> oro
  { avv: "Raptors '15-16", tuo: 93, loro: 84 },    // 9  -> argento
  { avv: "Celtics '15-16", tuo: 90, loro: 85 },    // 5  -> bronzo
  { avv: "Clippers '15-16", tuo: 94, loro: 79 },   // 15 -> oro
  { avv: "Trail Blazers '15-16", tuo: 92, loro: 89 }, // 3 -> bronzo
  { avv: "Hawks '15-16", tuo: 93, loro: 82 },      // 11 -> argento
  { avv: "Pacers '15-16", tuo: 95, loro: 83 },     // 12 -> argento
  { avv: "Rockets '15-16", tuo: 98, loro: 80 },    // 18 -> oro
  { avv: "Grizzlies '15-16", tuo: 87, loro: 86 },  // 1  -> bronzo
  { avv: "Heat '15-16", tuo: 93, loro: 90 },       // 3  -> bronzo
  { avv: "Jazz '15-16", tuo: 91, loro: 78 },       // 13 -> argento
  { avv: "Mavericks '15-16", tuo: 96, loro: 92 },  // 4  -> bronzo
  { avv: "Bulls '15-16", tuo: 100, loro: 82 },     // 18 -> oro
];
const ROUND_LOSE = ROUND_WIN.slice(0, 9).concat([
  { avv: "Thunder '15-16", tuo: 84, loro: 92, lose: true },
]);

const CLOU = {
  win_larga: "chiude forte nell'ultimo quarto e scappa via.",
  win_comoda: "gestisce il vantaggio senza affanni.",
  win_misura: "resiste al rientro avversario e chiude sul filo di lana.",
  lose: "prova la rimonta ma non basta, finisce qui.",
};

function fasciaOf(margine, persa) {
  if (persa) return { cls: "rosso", label: "KO" };
  if (margine >= 15) return { cls: "oro", label: "★" };
  if (margine >= 8) return { cls: "argento", label: "●" };
  return { cls: "bronzo", label: "▲" };
}

function buildRows(dataset) {
  const el = document.getElementById("storia");
  el.innerHTML = dataset.map((r, i) => {
    const persa = !!r.lose;
    const margine = Math.abs(r.tuo - r.loro);
    const f = fasciaOf(margine, persa);
    const clouKey = persa ? "lose" : margine >= 15 ? "win_larga" : margine >= 8 ? "win_comoda" : "win_misura";
    const clou = CLOU[clouKey];
    const half = Math.round(r.tuo / 4), halfL = Math.round(r.loro / 4);
    const quarti = [0, 1, 2, 3].map(qi => {
      const j = (qi % 2 === 0 ? 1 : -1) * (1 + (i % 2));
      return `<span>Q${qi + 1} ${half + j}-${halfL - j}</span>`;
    }).join("");
    return `<li style="--i:${i}">
      <div class="r-row" data-idx="${i}">
        <span class="r-round">R${i + 1}</span>
        <span class="r-fascia ${f.cls}">${f.label}</span>
        <span class="r-mid">
          <span class="r-avv">${r.avv}</span>
          <span class="r-clou">${clou}</span>
        </span>
        <span class="r-pt">${r.tuo}-${r.loro}</span>
      </div>
      <div class="r-detail"><div class="r-detail-in">
        <div class="r-quarti">${quarti}</div>
        <p class="r-clou-full"><b>${persa ? "Ultimo quarto" : "Quarto decisivo"}:</b> ${clou}</p>
      </div></div>
    </li>`;
  }).join("");
  el.querySelectorAll(".r-row").forEach(row => {
    row.addEventListener("click", () => row.closest("li").classList.toggle("open"));
  });
}

let dir = "A";
let esitoState = "win";

function play() {
  const root = document.getElementById("esito");
  const flash = document.getElementById("flash");
  const ladder = document.getElementById("ladder");
  const beacon = document.getElementById("beacon");
  const score = document.getElementById("score");
  const title = document.getElementById("title");
  const riepilogo = document.getElementById("riepilogo");
  const storia = document.getElementById("storia");
  const azioni = document.querySelector(".azioni");

  const dataset = esitoState === "win" ? ROUND_WIN : ROUND_LOSE;
  const vinto = esitoState === "win";

  root.className = "screen esito " + (vinto ? "win" : "lose");
  buildRows(dataset);

  [flash, title, riepilogo, storia, azioni].forEach(e => { e.style.animation = "none"; e.style.opacity = 0; });
  ladder.hidden = true; ladder.innerHTML = ""; ladder.style.opacity = 0;
  beacon.hidden = true; beacon.classList.remove("settled"); beacon.style.background = ""; beacon.style.opacity = 0;
  title.textContent = vinto ? "IMBATTUTO" : "SCONFITTA";
  const vittorie = dataset.filter(r => !r.lose).length;
  riepilogo.textContent = vinto ? `${vittorie} vittorie di fila` : `${vittorie} vittorie prima dello stop`;
  score.innerHTML = `<b>0</b>-${vinto ? 0 : 0}`;

  void root.offsetWidth; // reflow, riabilita le animazioni

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced) {
    score.innerHTML = `<b>${vittorie}</b>-${vinto ? 0 : 1}`;
    [title, riepilogo, storia, azioni].forEach(e => e.style.opacity = 1);
    if (dir === "C") { beacon.hidden = false; beacon.style.opacity = 1; beacon.classList.add("settled"); }
    if (dir === "B") { ladder.hidden = false; ladder.style.opacity = 1; ladder.innerHTML = dataset.map(() => `<div class="e-tacca lit"></div>`).join(""); }
    return;
  }

  let n = 0;
  const scoreTimer = setInterval(() => {
    n++;
    score.innerHTML = `<b>${n}</b>-${vinto ? 0 : 1}`;
    if (n >= vittorie) clearInterval(scoreTimer);
  }, vinto ? 700 / vittorie : 900 / vittorie);

  if (dir === "A") {
    flash.style.animation = `flashBurst ${vinto ? 1 : .6}s ease-out .55s both`;
    title.style.animation = `stampIn .5s cubic-bezier(.2,1.6,.4,1) .7s both`;
    riepilogo.style.animation = `simpleIn .4s var(--ease) 1.05s both`;
    storia.style.animation = `simpleIn .3s var(--ease) 1.2s both`;
    azioni.style.animation = `simpleIn .3s var(--ease) 1.35s both`;
  } else if (dir === "B") {
    ladder.hidden = false;
    ladder.innerHTML = dataset.map(() => `<div class="e-tacca"></div>`).join("");
    ladder.style.opacity = 1;
    const tacche = ladder.querySelectorAll(".e-tacca");
    tacche.forEach((t, i) => { t.style.animation = `tPop .18s ease-out ${i * 45}ms both`; setTimeout(() => t.classList.add("lit"), i * 45); });
    const afterLadder = tacche.length * 45 + 250;
    flash.style.animation = `flashBurst ${vinto ? .7 : .4}s ease-out ${afterLadder}ms both`;
    title.style.animation = `stampIn .5s cubic-bezier(.2,1.6,.4,1) ${afterLadder + 150}ms both`;
    riepilogo.style.animation = `simpleIn .4s var(--ease) ${afterLadder + 500}ms both`;
    storia.style.animation = `simpleIn .3s var(--ease) ${afterLadder + 650}ms both`;
    azioni.style.animation = `simpleIn .3s var(--ease) ${afterLadder + 800}ms both`;
  } else {
    beacon.hidden = false;
    beacon.style.opacity = 1;
    beacon.style.background = vinto ? "var(--yellow)" : "var(--red)";
    beacon.style.animation = `beaconPulse .3s steps(1) 4`;
    setTimeout(() => { beacon.classList.add("settled"); beacon.style.background = ""; }, 1250);
    title.style.animation = `typeIn .55s steps(9) .5s both`;
    riepilogo.style.animation = `simpleIn .4s var(--ease) 1.25s both`;
    storia.style.animation = `simpleIn .3s var(--ease) 1.4s both`;
    azioni.style.animation = `simpleIn .3s var(--ease) 1.55s both`;
  }
}

const styleTag = document.createElement("style");
styleTag.textContent = `
@keyframes flashBurst { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.55); } 45% { opacity: .95; transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.3); } }
@keyframes stampIn { 0% { transform: scale(1.5); opacity: 0; } 70% { transform: scale(.96); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes tPop { from { transform: scaleY(.3); opacity: .4; } to { transform: scaleY(1); opacity: 1; } }
@keyframes beaconPulse { 50% { opacity: .35; } }
@keyframes typeIn { from { clip-path: inset(0 100% 0 0); opacity: 1; } to { clip-path: inset(0 0 0 0); opacity: 1; } }
@keyframes simpleIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
`;
document.head.appendChild(styleTag);

// API di controllo, chiamata dal genitore (lab chrome in 83-esito-cabina90.html).
window.setDir = (d) => { dir = d; play(); };
window.setEsito = (e) => { esitoState = e; play(); };
window.replay = () => play();

play();
</script>
</body>
</html>
