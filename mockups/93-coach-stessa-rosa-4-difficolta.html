<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUZZER · Coach · stessa rosa</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#0b0d2c;
  --cab:#11143a;
  --panel:#171a49;
  --panel2:#1d2053;
  --line:#343875;
  --line2:#444987;
  --txt:#f5f0df;
  --dim:#9999c5;
  --yellow:#ffcf33;
  --orange:#ff6533;
  --blue:#139cff;
  --green:#56e29a;
  --red:#ff654d;
}

body{
  margin:0;
  background:#2d2d2d;
  color:var(--txt);
  font-family:Arial,sans-serif;
}

.page{
  width:min(1480px,100%);
  margin:auto;
  padding:28px 18px 70px;
}

h1{
  margin:0 0 6px;
  color:var(--yellow);
  font-size:24px;
}

.intro{
  margin:0 0 24px;
  color:#b0afd0;
  line-height:1.45;
}

.intro b{color:var(--txt)}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:22px;
}

.demo{
  overflow:hidden;
  border:1px solid #373b79;
  border-radius:20px;
  background:
    radial-gradient(circle at 85% 0,rgba(93,46,111,.18),transparent 36%),
    var(--cab);
  box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:17px 20px;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.logo{
  color:var(--yellow);
  font-size:20px;
  font-weight:1000;
  letter-spacing:.03em;
}

.logo b{color:var(--orange)}

.level{
  padding:9px 15px;
  border:1px solid #414580;
  border-radius:999px;
  background:#2b1e40;
  font-size:12px;
  font-weight:1000;
  letter-spacing:.08em;
}

.content{
  padding:18px;
}

.draft-done{
  margin-bottom:14px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:11px;
  background:rgba(13,15,48,.65);
}

.draft-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:9px;
  color:var(--dim);
  font-size:11px;
  font-weight:900;
  letter-spacing:.09em;
  text-transform:uppercase;
}

.five{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.p{
  padding:8px 3px;
  border:1px solid #383d7b;
  border-radius:9px;
  background:#151842;
  text-align:center;
}

.p span{
  display:block;
  color:#9597c4;
  font-size:10px;
  font-weight:900;
}

.p b{
  display:block;
  margin-top:5px;
  color:var(--txt);
  font-family:monospace;
  font-size:17px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin:15px 0 9px;
  color:#aaaad0;
  font-size:11px;
  font-weight:900;
  letter-spacing:.11em;
  text-transform:uppercase;
}

.scout{
  padding:11px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(10,12,42,.76);
}

.scout-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:9px;
  color:var(--dim);
  font-size:10px;
  font-weight:900;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.reps{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:5px;
}

.rep{
  min-width:0;
  padding:8px 3px;
  border:1px solid #3b3f79;
  border-radius:8px;
  background:#12143b;
  text-align:center;
}

.rep small{
  display:block;
  color:#9697bd;
  font-size:9px;
  font-weight:900;
}

.rep strong{
  display:block;
  margin-top:6px;
  color:var(--txt);
  font-family:monospace;
  font-size:18px;
  white-space:nowrap;
}

.rep strong.up{color:var(--green)}
.rep strong.down{color:var(--red)}

.easy .rep.best{
  border-color:rgba(86,226,154,.75);
  box-shadow:inset 0 0 0 1px rgba(86,226,154,.12);
}

.easy .rep.weak{
  border-color:rgba(255,101,77,.8);
  box-shadow:inset 0 0 0 1px rgba(255,101,77,.12);
}

.segs{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:2px;
  margin-top:10px;
}

.segs i{
  display:block;
  height:6px;
  border-radius:2px;
  background:#292d63;
}

.segs i.on{background:var(--yellow)}
.segs i.up{background:var(--green)}
.segs i.down{background:var(--red)}

.hidden-scout{
  padding:18px;
  border:1px dashed #343873;
  border-radius:11px;
  color:#7477a5;
  text-align:center;
  font-size:12px;
}

.coaches{
  display:grid;
  gap:7px;
}

.coach{
  width:100%;
  display:grid;
  grid-template-columns:34px minmax(0,1fr) auto;
  align-items:center;
  gap:9px;
  padding:11px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#181b49;
  color:inherit;
  text-align:left;
  cursor:pointer;
}

.coach:hover{
  border-color:#656bb3;
}

.coach.on{
  border-color:var(--yellow);
  box-shadow:inset 0 0 0 1px var(--yellow);
  background:#202250;
}

.arrow{
  color:#a6a7cf;
  font-size:24px;
  text-align:center;
}

.coach.on .arrow{color:var(--yellow)}

.coach-name{
  display:block;
  color:var(--yellow);
  font-size:12px;
  font-weight:1000;
  letter-spacing:.035em;
}

.coach.on .coach-name{color:var(--txt)}

.tactic{
  display:block;
  margin-top:3px;
  color:#999ac2;
  font-size:11px;
}

.chips{
  display:flex;
  gap:3px;
}

.chip{
  padding:5px 5px;
  border:1px solid #3d417b;
  border-radius:7px;
  background:#11143a;
  font-family:monospace;
  font-size:10px;
  white-space:nowrap;
}

.chip.plus{color:var(--green)}
.chip.minus{color:var(--red)}

.rating{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:14px;
  padding:12px 14px;
  border:1px solid #655a2b;
  border-radius:12px;
  background:#22223f;
}

.rating span{
  color:#a5a5cd;
  font-size:10px;
  font-weight:900;
  letter-spacing:.09em;
  text-transform:uppercase;
}

.rating b{
  font-family:monospace;
  font-size:22px;
}

.rating .after{color:var(--green)}

.note{
  margin:12px 0 0;
  color:#9495bc;
  font-size:11px;
  line-height:1.5;
}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
}

@media(max-width:520px){
  .page{padding:10px 7px 40px}
  .content{padding:12px 9px}
  .top{padding:14px 11px}
  .coach{
    grid-template-columns:28px minmax(0,1fr);
  }
  .chips{
    grid-column:2;
    flex-wrap:wrap;
  }
}
</style>

];

const order = ["t3","fin","dif","reb","reg"];

const labels = {
  t3:"T3",
  fin:"FIN",
  dif:"DIF",
  reb:"REB",
  reg:"REG"
};

function changed(base, delta){
  return Math.max(0,Math.min(99,base+(delta||0)));
}

function segCount(v){
  if(v < 70) return 1;
  if(v < 85) return 2;
  return 3;
}

function calcOvr(vals){
  return Math.round(
    vals.t3 * .12 +
    vals.fin * .16 +
    vals.dif * .40 +
    vals.reb * .20 +
    vals.reg * .12
  );
}

function starterHTML(){
  return `
    <div class="draft-done">
      <div class="draft-top">
        <span>Quintetto titolare</span>
        <span>Rosa completa · 10/10</span>
      </div>

      <div class="five">
        ${STARTERS.map(p=>`
          <span class="p">
            <span class="r">${p.role}</span>

            <span class="face-wrap">
              <img
                class="face"
                src="${p.face || ''}"
                alt="${p.name}"
                onerror="this.style.display='none'; this.closest('.p').classList.add('no-face');"
              >
              <span class="sil" aria-hidden="true"></span>
            </span>

            <span class="meta">
              <span class="txt">
                <span class="nm">${p.name}</span>
                <span class="sub">TITOLARE</span>
              </span>

              <span class="ovr-box">
                <b>${p.ovr}</b>
                <span class="ovr">OVR</span>
              </span>
            </span>
          </span>
        `).join("")}
      </div>
    </div>
  `;
}

function coachesHTML(){
  return `
    <div class="coaches">
      ${COACHES.map(c=>`
        <button class="coach" data-coach="${c.id}" type="button">
          <span class="arrow">${c.arrow}</span>
          <span>
            <span class="coach-name">${c.name}</span>
            <span class="tactic">${c.tactic}</span>
          </span>
          <span class="chips">
            ${Object.entries(c.changes).map(([k,v])=>`
              <span class="chip ${v>0?"plus":"minus"}">
                ${v>0?"▲":"▼"} ${labels[k]}
              </span>
            `).join("")}
          </span>
        </button>
      `).join("")}
    </div>
  `;
}

function repExact(rep,v,after,difficulty,min,max){
  let cls = "";
  if(difficulty==="facile"){
    if(v===max) cls+=" best";
    if(v===min) cls+=" weak";
  }

  let value = String(v);
  let valueClass = "";

  if(after!==null && after!==v){
    value = `${v}›${after}`;
    valueClass = after>v ? "up" : "down";
  }

  return `
    <span class="rep${cls}">
      <small>${labels[rep]}</small>
      <strong class="${valueClass}">${value}</strong>
    </span>
  `;
}

function repSegments(rep,v,after){
  const show = after ?? v;
  const beforeN = segCount(v);
  const afterN = segCount(show);

  return `
    <span class="rep">
      <small>${labels[rep]}</small>
      <span class="segs">
        ${Array.from({length:3},(_,i)=>{
          let cls = "";
          if(i < afterN) cls="on";
          if(after!==null && afterN>beforeN && i>=beforeN && i<afterN) cls="up";
          if(after!==null && afterN<beforeN && i>=afterN && i<beforeN) cls="down";
          return `<i class="${cls}"></i>`;
        }).join("")}
      </span>
    </span>
  `;
}

function cardHTML(cfg){
  return `
    <section class="demo ${cfg.key==="facile"?"easy":""}" data-level="${cfg.key}">
      <header class="top">
        <span class="logo">BUZ<b>Z</b>ER</span>
        <span class="level">🔥 ${cfg.title}</span>
      </header>

      <div class="content">
        ${starterHTML()}

        <div class="section-head">
          <span>Panchina</span>
          <span>Ultimo passo: poi si gioca</span>
        </div>

        <div class="scout-wrap"></div>

        ${coachesHTML()}

        <div class="rating">
          <span>Il tuo voto squadra</span>
          <b><span class="before">${OVR}</span> › <span class="after">--</span></b>
        </div>

        <p class="note">${cfg.note}</p>
      </div>
    </section>
  `;
}

document.querySelector("#grid").innerHTML =
  CONFIG.map(cardHTML).join("");

function renderScout(card,coach=null){
  const level = card.dataset.level;
  const wrap = card.querySelector(".scout-wrap");

  if(level==="incubo"){
    wrap.innerHTML = "";
    return;
  }

  const after = coach
    ? Object.fromEntries(
        order.map(k=>[k,changed(BASE[k],coach.changes[k])])
      )
    : null;

  const vals = Object.values(BASE);
  const min = Math.min(...vals);
  const max = Math.max(...vals);

  wrap.innerHTML = `
    <div class="scout">
      <div class="scout-title">
        <span>Reparti squadra</span>
        <span>${coach ? "ANTEPRIMA COACH" : "PRIMA DEL COACH"}</span>
      </div>

      <div class="reps">
        ${order.map(k=>{
          if(level==="difficile"){
            return repSegments(k,BASE[k],after ? after[k] : null);
          }
          return repExact(
            k,
            BASE[k],
            after ? after[k] : null,
            level,
            min,
            max
          );
        }).join("")}
      </div>
    </div>
  `;
}

document.querySelectorAll(".demo").forEach(card=>{
  renderScout(card);

  card.querySelectorAll(".coach").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const coach=COACHES.find(c=>c.id===btn.dataset.coach);

      card.querySelectorAll(".coach").forEach(x=>
        x.classList.toggle("on",x===btn)
      );

      renderScout(card,coach);

      const afterVals=Object.fromEntries(
        order.map(k=>[
          k,
          changed(BASE[k],coach.changes[k])
        ])
      );

      const afterOvr=calcOvr(afterVals);

      card.querySelector(".after").textContent=afterOvr;
      card.querySelector(".after").style.color=
        afterOvr>OVR ? "var(--green)" :
        afterOvr<OVR ? "var(--red)" :
        "var(--txt)";
    });
  });
});
</script>

</body>
</html>
