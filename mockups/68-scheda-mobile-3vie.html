<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scheda draft mobile - 3 vie · mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Bungee&family=Doto:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../prototype/imbattuto/styles.css">
<style>
  :root{ --lbl:#adaee0; }
  body{background:#07071a}
  .mkbar{position:sticky;top:0;z-index:30;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    padding:12px 16px;background:#0c0d24;border-bottom:1px solid var(--line)}
  .mkbar .lbl{font-family:var(--body);font-weight:800;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-dim)}
  .mkbar button{font-family:var(--body);font-weight:700;font-size:.72rem;color:var(--bone-dim);
    background:#171636;border:1px solid var(--line);border-radius:9px;padding:9px 13px;min-height:44px;cursor:pointer}
  .mkbar button[aria-pressed="true"]{background:var(--brass);color:#0a0a18;border-color:var(--brass)}
  .mkbar .hint{font-family:var(--body);font-size:.66rem;color:var(--bone-dim);margin-left:auto;max-width:46ch;text-align:right}

  /* ---------- telefono ---------- */
  .stage{display:flex;justify-content:center;padding:26px 16px 60px}
  .phone{width:390px;max-width:100%;height:788px;border-radius:44px;border:11px solid #000;
    background:var(--ink);overflow:hidden;position:relative;
    box-shadow:0 40px 90px -30px rgba(0,0,0,.9), inset 0 0 0 2px #23234f}
  .phone::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:118px;height:26px;background:#000;border-radius:0 0 16px 16px;z-index:20}
  .scr{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .scr::-webkit-scrollbar{display:none}
  .draft{max-width:none!important;padding:34px 15px 16px!important}

  .mono-badge{display:grid;place-items:center;border-radius:9px;font-family:var(--arcade);color:#fff;
    background:linear-gradient(158deg,#1D428A,#0d1f45);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
  .tier-hi{color:var(--green)} .tier-mid{color:var(--brass)} .tier-lo{color:var(--red)}

  /* =================== A · TABELLONE LED =================== */
  .a-card{border:1px solid var(--line);border-radius:16px;overflow:hidden;
    background:linear-gradient(180deg,#191a3d,#111230);box-shadow:0 16px 34px -22px rgba(0,0,0,.85)}
  .a-head{display:flex;align-items:center;gap:12px;padding:13px 14px 12px}
  .a-head .mono-badge{width:50px;height:60px;font-size:1.05rem;flex:none}
  .a-id{flex:1;min-width:0}
  .a-id .nm{display:block;font-family:var(--arcade);font-size:1.02rem;line-height:1.04;color:var(--bone)}
  .a-id .sub{display:block;font-family:var(--body);font-weight:800;font-size:.54rem;letter-spacing:.09em;
    text-transform:uppercase;color:var(--lbl);margin-top:6px}
  .a-ovr{text-align:center;flex:none;padding-left:4px}
  .a-ovr b{display:block;font-family:var(--led);font-weight:900;font-size:2.5rem;line-height:.76;color:var(--yellow);
    text-shadow:0 0 15px rgba(255,207,51,.3)}
  .a-ovr small{font-family:var(--body);font-weight:800;font-size:.42rem;letter-spacing:.15em;text-transform:uppercase;color:var(--lbl)}
  .a-big{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:rgba(0,0,0,.16)}
  .a-big .cell{padding:12px 6px;text-align:center;border-left:1px solid rgba(255,255,255,.05)}
  .a-big .cell:first-child{border-left:0}
  .a-big .cell b{display:block;font-family:var(--led);font-weight:900;font-size:1.7rem;line-height:1;color:var(--brass)}
  .a-big .cell small{display:block;font-family:var(--body);font-weight:800;font-size:.46rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--lbl);margin-top:6px}
  .a-bars{padding:12px 14px 4px;display:grid;gap:9px}
  .a-bar{display:grid;grid-template-columns:52px 1fr 42px;align-items:center;gap:10px}
  .a-bar .k{font-family:var(--body);font-weight:800;font-size:.56rem;letter-spacing:.05em;text-transform:uppercase;color:var(--lbl)}
  .a-bar .track{height:8px;border-radius:5px;background:#0c0d22;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);overflow:hidden}
  .a-bar .fill{display:block;height:100%;border-radius:5px}
  .a-bar .v{font-family:var(--led);font-weight:900;font-size:.92rem;text-align:right;color:var(--bone)}
  .a-def{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:10px}
  .a-def .cell{padding:9px 4px;text-align:center;border-left:1px solid rgba(255,255,255,.05)}
  .a-def .cell:first-child{border-left:0}
  .a-def .cell b{display:block;font-family:var(--led);font-weight:700;font-size:.92rem;color:var(--bone);line-height:1}
  .a-def .cell small{display:block;font-family:var(--body);font-weight:800;font-size:.42rem;letter-spacing:.06em;
    text-transform:uppercase;color:var(--lbl);margin-top:5px}
  .a-foot{display:flex;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--line);
    font-family:var(--body);font-weight:800;font-size:.5rem;letter-spacing:.08em;text-transform:uppercase;color:var(--lbl)}
  .a-foot .gp-lo{color:var(--red)}
  .a-short{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
  .a-short::-webkit-scrollbar{display:none}
  .a-chip{flex:none;width:74px;border:1px solid var(--line);border-radius:12px;padding:9px 6px 8px;text-align:center;
    background:#161638;cursor:pointer;min-height:44px}
  .a-chip.on{border-color:var(--yellow);background:rgba(255,207,51,.12)}
  .a-chip .mono-badge{width:38px;height:38px;font-size:.78rem;margin:0 auto 6px;border-radius:9px}
  .a-chip .cn{display:block;font-family:var(--body);font-weight:800;font-size:.5rem;color:var(--bone);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .a-chip .co{display:block;font-family:var(--led);font-weight:900;font-size:.82rem;color:var(--yellow);margin-top:2px}

  /* =================== B · SWIPE COCKPIT =================== */
  .b-wrap{margin:0 -3px}
  .b-track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 4px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .b-track::-webkit-scrollbar{display:none}
  .b-slide{flex:0 0 100%;scroll-snap-align:center;border:1px solid var(--line);border-radius:18px;overflow:hidden;
    background:linear-gradient(180deg,#1b1c42,#111230)}
  .b-top{position:relative;display:flex;align-items:center;gap:12px;padding:15px 16px;
    background:linear-gradient(120deg,#1D428A,#122a5c)}
  .b-top .mono-badge{width:44px;height:54px;font-size:.95rem;background:rgba(0,0,0,.24);flex:none}
  .b-who{flex:1;min-width:0}
  .b-who .nm{display:block;font-family:var(--arcade);font-size:1.05rem;line-height:1.05;color:#fff}
  .b-who .sub{display:block;font-family:var(--body);font-weight:800;font-size:.5rem;letter-spacing:.09em;
    text-transform:uppercase;color:rgba(255,255,255,.8);margin-top:5px}
  .b-ovr{text-align:center;flex:none}
  .b-ovr b{display:block;font-family:var(--led);font-weight:900;font-size:2.9rem;line-height:.74;color:var(--yellow);
    text-shadow:0 0 16px rgba(255,207,51,.35)}
  .b-ovr small{font-family:var(--body);font-weight:800;font-size:.42rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.72)}
  .b-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .b-cell{padding:13px 16px;border-top:1px solid var(--line);border-left:1px solid var(--line);
    display:flex;align-items:baseline;justify-content:space-between}
  .b-cell:nth-child(odd){border-left:0}
  .b-cell .k{font-family:var(--body);font-weight:800;font-size:.56rem;letter-spacing:.05em;text-transform:uppercase;color:var(--lbl)}
  .b-cell .v{font-family:var(--led);font-weight:900;font-size:1.15rem;color:var(--bone)}
  .b-cell .v.hot{color:var(--brass)}
  .b-foot{padding:9px 16px;border-top:1px solid var(--line);text-align:center;
    font-family:var(--body);font-weight:800;font-size:.5rem;letter-spacing:.08em;text-transform:uppercase;color:var(--lbl)}
  .b-foot .gp-lo{color:var(--red)}
  .b-dots{display:flex;justify-content:center;gap:7px;padding:12px 0 2px}
  .b-dots i{width:7px;height:7px;border-radius:50%;background:#3a3a6e;transition:all .2s}
  .b-dots i.on{background:var(--yellow);width:20px;border-radius:4px}

  /* =================== C · LISTA COMPARATIVA =================== */
  .c-list{display:grid;gap:8px}
  .c-row{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#161638;cursor:pointer}
  .c-row.on{border-color:var(--yellow);background:linear-gradient(180deg,#1c1d44,#141335)}
  .c-main{display:grid;grid-template-columns:26px auto 1fr auto;align-items:center;gap:11px;padding:11px 13px;min-height:44px}
  .c-rk{font-family:var(--led);font-weight:900;font-size:.9rem;color:#5a5a93;text-align:center}
  .c-row.on .c-rk{color:var(--yellow)}
  .c-nm{min-width:0}
  .c-nm b{display:block;font-family:var(--body);font-weight:800;font-size:.82rem;color:var(--bone);line-height:1.1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-nm small{display:block;font-family:var(--body);font-weight:800;font-size:.46rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--lbl);margin-top:3px}
  .c-mini{display:flex;gap:12px;justify-self:end}
  .c-mini span{text-align:center}
  .c-mini b{display:block;font-family:var(--led);font-weight:900;font-size:.88rem;color:var(--bone);line-height:1}
  .c-mini small{display:block;font-family:var(--body);font-weight:800;font-size:.4rem;letter-spacing:.06em;
    text-transform:uppercase;color:var(--lbl);margin-top:3px}
  .c-ov{font-family:var(--led);font-weight:900;font-size:1.5rem;color:var(--yellow);line-height:1;text-align:center;min-width:30px}
  .c-row:not(.on) .c-ov{color:var(--brass)}
  .c-exp{max-height:0;overflow:hidden;transition:max-height .28s var(--ease,ease)}
  .c-row.on .c-exp{max-height:260px}
  .c-full{padding:2px 13px 13px}
  .c-g{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .c-g .cell{background:#12122f;padding:9px 4px;text-align:center}
  .c-g .cell b{display:block;font-family:var(--led);font-weight:900;font-size:1rem;color:var(--bone);line-height:1}
  .c-g .cell small{display:block;font-family:var(--body);font-weight:800;font-size:.42rem;letter-spacing:.05em;
    text-transform:uppercase;color:var(--lbl);margin-top:5px}
  .c-note{margin-top:8px;font-family:var(--body);font-weight:700;font-size:.56rem;color:var(--lbl);text-align:center}
  .c-note .gp-lo{color:var(--red)}

  @media (prefers-reduced-motion:reduce){ .c-exp,.b-dots i{transition:none} }
</style>
</head>
<body>

<div class="mkbar">
  <span class="lbl">Direzione</span>
  <button data-s="A" aria-pressed="true">A · Tabellone LED</button>
  <button data-s="B" aria-pressed="false">B · Swipe cockpit</button>
  <button data-s="C" aria-pressed="false">C · Lista comparativa</button>
  <span class="hint">Mobile-first, telefono 390px. Stesse stat reali + OVR 2K, tre modi di sfruttare lo spazio. Scrolla dentro il telefono.</span>
</div>

<div class="stage">
  <div class="phone"><div class="scr" id="scr"></div></div>
</div>

<script type="module">
const ROLES=["PG","SG","SF","PF","C"];
const CARDS=[
  {n:"Stephen Curry",  ini:"SC",pos:"PG",ovr:94,s:{pts:30.1,reb:5.4,ast:6.7,stl:2.1,blk:0.2,tov:3.3,fg:50.4,tp:45.4,ft:90.8,gp:79,min:34.2}},
  {n:"Klay Thompson",  ini:"KT",pos:"SG",ovr:90,s:{pts:22.1,reb:3.8,ast:2.1,stl:0.8,blk:0.6,tov:1.7,fg:47.0,tp:42.5,ft:87.3,gp:80,min:33.3}},
  {n:"Draymond Green", ini:"DG",pos:"PF",ovr:90,s:{pts:14.0,reb:9.5,ast:7.4,stl:1.5,blk:1.4,tov:3.2,fg:49.0,tp:38.8,ft:69.6,gp:81,min:34.7}},
  {n:"Andre Iguodala", ini:"AI",pos:"SF",ovr:81,s:{pts:7.0, reb:4.0,ast:3.4,stl:1.1,blk:0.3,tov:1.2,fg:47.8,tp:35.1,ft:61.4,gp:65,min:26.6}},
  {n:"Andrew Bogut",   ini:"AB",pos:"C", ovr:77,s:{pts:5.4, reb:7.0,ast:2.3,stl:0.5,blk:1.6,tov:1.2,fg:62.7,tp:0,  ft:48.0,gp:70,min:20.7}},
];
let struct="A", focus=0;

const FLAME=`<svg viewBox="0 0 24 24" aria-hidden="true"><path class="f1" d="M13.5.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l.03-.36C5.21 7.51 4 10.62 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5.67z"/><path class="f2" d="M11.71 19c-1.78 0-3.22-1.4-3.22-3.14 0-1.62 1.05-2.76 2.81-3.12 1.77-.36 3.6-1.21 4.62-2.58.39 1.29.59 2.65.59 4.04 0 2.65-2.15 4.8-4.8 4.8z"/></svg>`;
const PLUS=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>`;
const last=n=>n.split(" ").pop();
const gpTxt=s=>`${s.gp<70?`<span class="gp-lo">${s.gp} partite</span>`:`${s.gp} partite`} · ${s.min} min`;
// tier per percentuali di tiro (scala tiro reale)
const shotTier=(v,g,ok)=> v>=g?"var(--green)": v>=ok?"var(--yellow)":"var(--red)";

// -------- header + court condivisi --------
function shell(bodyHTML,ctaName){
  const court=ROLES.map((r,i)=>
    (r==="PG")
      ? `<span class="cc target"><span class="face"><span class="phplus">+</span><span class="fbadge"><span class="r">PG</span><span class="o">?</span></span></span></span>`
      : `<span class="cc empty"><span class="face"><span class="mono">${r}</span></span></span>`
  ).join("");
  return `<section class="screen draft">
    <div class="apphd"><div class="wm">BU<b>ZZ</b>ER</div>
      <div class="mode-pill"><span class="mp-ico">${FLAME}</span><span class="mp-txt">Normale</span></div></div>
    <div class="court-block">
      <div class="seclab"><span>Il tuo quintetto · 0/5</span></div>
      <div class="court">${court}</div>
    </div>
    <div class="cand-block">
      <div class="seclab"><span>Candidati PG · 5</span>
        <div class="aidz"><button class="aid" type="button">re-spin <b>2</b></button><button class="aid" type="button">↺ squadra <b>1</b></button></div>
      </div>
      ${bodyHTML}
      <button class="cta" type="button">${PLUS} Metti ${ctaName} nel quintetto</button>
    </div>
    <p class="src">Da <b>Golden State Warriors</b> · 2015-16</p>
  </section>`;
}

// -------- A · TABELLONE --------
function bodyA(){
  const c=CARDS[focus], s=c.s;
  const bar=(k,v,g,ok)=>`<div class="a-bar"><span class="k">${k}</span>
    <span class="track"><span class="fill" style="width:${Math.min(v,100)}%;background:${shotTier(v,g,ok)}"></span></span>
    <span class="v">${v}</span></div>`;
  const hero=`<div class="a-card">
    <div class="a-head">
      <span class="mono-badge">${c.ini}</span>
      <span class="a-id"><span class="nm">${c.n}</span><span class="sub">${c.pos} · Golden State · '15-16</span></span>
      <span class="a-ovr"><b>${c.ovr}</b><small>OVR 2K</small></span>
    </div>
    <div class="a-big">
      <span class="cell"><b>${s.pts}</b><small>Punti</small></span>
      <span class="cell"><b>${s.reb}</b><small>Rimbalzi</small></span>
      <span class="cell"><b>${s.ast}</b><small>Assist</small></span>
    </div>
    <div class="a-bars">
      ${bar("FG%",s.fg,50,44)}
      ${bar("Da 3",s.tp,38,33)}
      ${bar("Liberi",s.ft,80,70)}
    </div>
    <div class="a-def">
      <span class="cell"><b>${s.stl}</b><small>Rubate</small></span>
      <span class="cell"><b>${s.blk}</b><small>Stoppate</small></span>
      <span class="cell"><b>${s.tov}</b><small>Palle perse</small></span>
    </div>
    <div class="a-foot"><span>${gpTxt(s)}</span><span>'15-16 · GSW</span></div>
  </div>
  <div class="a-short">
    ${CARDS.map((x,i)=>`<button class="a-chip ${i===focus?"on":""}" data-i="${i}" type="button">
      <span class="mono-badge">${x.ini}</span><span class="cn">${last(x.n)}</span><span class="co">${x.ovr}</span></button>`).join("")}
  </div>`;
  return hero;
}

// -------- B · SWIPE --------
function bodyB(){
  const slide=(c)=>{const s=c.s;return `<div class="b-slide">
    <div class="b-top">
      <span class="mono-badge">${c.ini}</span>
      <span class="b-who"><span class="nm">${c.n}</span><span class="sub">${c.pos} · Golden State</span></span>
      <span class="b-ovr"><b>${c.ovr}</b><small>OVR 2K</small></span>
    </div>
    <div class="b-grid">
      <span class="b-cell"><span class="k">Punti</span><span class="v hot">${s.pts}</span></span>
      <span class="b-cell"><span class="k">Tiro FG</span><span class="v">${s.fg}%</span></span>
      <span class="b-cell"><span class="k">Rimbalzi</span><span class="v">${s.reb}</span></span>
      <span class="b-cell"><span class="k">Da 3</span><span class="v">${s.tp}%</span></span>
      <span class="b-cell"><span class="k">Assist</span><span class="v">${s.ast}</span></span>
      <span class="b-cell"><span class="k">Liberi</span><span class="v">${s.ft}%</span></span>
      <span class="b-cell"><span class="k">Rubate</span><span class="v">${s.stl}</span></span>
      <span class="b-cell"><span class="k">Stoppate</span><span class="v">${s.blk}</span></span>
    </div>
    <div class="b-foot">${gpTxt(s)} · 2015-16</div>
  </div>`;};
  return `<div class="b-wrap"><div class="b-track" id="btrack">${CARDS.map(slide).join("")}</div>
    <div class="b-dots">${CARDS.map((_,i)=>`<i class="${i===focus?"on":""}" data-i="${i}"></i>`).join("")}</div></div>`;
}

// -------- C · LISTA --------
function bodyC(){
  const row=(c,i)=>{const s=c.s;return `<div class="c-row ${i===focus?"on":""}" data-i="${i}">
    <div class="c-main">
      <span class="c-rk">${i+1}</span>
      <span class="c-ov">${c.ovr}</span>
      <span class="c-nm"><b>${c.n}</b><small>${c.pos} · '15-16</small></span>
      <span class="c-mini">
        <span><b>${s.pts}</b><small>PT</small></span>
        <span><b>${s.reb}</b><small>RB</small></span>
        <span><b>${s.ast}</b><small>AS</small></span>
      </span>
    </div>
    <div class="c-exp"><div class="c-full">
      <div class="c-g">
        <span class="cell"><b>${s.fg}%</b><small>Tiro FG</small></span>
        <span class="cell"><b>${s.tp}%</b><small>Da 3</small></span>
        <span class="cell"><b>${s.ft}%</b><small>Liberi</small></span>
        <span class="cell"><b>${s.stl}</b><small>Rubate</small></span>
        <span class="cell"><b>${s.blk}</b><small>Stoppate</small></span>
        <span class="cell"><b>${s.tov}</b><small>Persi</small></span>
      </div>
      <p class="c-note">${gpTxt(s)}</p>
    </div></div>
  </div>`;};
  return `<div class="c-list">${CARDS.map(row).join("")}</div>`;
}

function render(){
  const scr=document.getElementById("scr");
  const body = struct==="A"?bodyA(): struct==="B"?bodyB(): bodyC();
  scr.innerHTML=shell(body, last(CARDS[focus].n));

  if(struct==="A"){
    scr.querySelectorAll(".a-chip").forEach(b=>b.onclick=()=>{focus=+b.dataset.i;render();});
  }
  if(struct==="B"){
    const track=document.getElementById("btrack");
    // scroll alla slide a fuoco senza animazione (evita salti al re-render)
    track.scrollLeft = focus * track.clientWidth;
    let raf;
    track.addEventListener("scroll",()=>{
      cancelAnimationFrame(raf);
      raf=requestAnimationFrame(()=>{
        const i=Math.round(track.scrollLeft/track.clientWidth);
        if(i!==focus){focus=i;
          scr.querySelectorAll(".b-dots i").forEach((d,k)=>d.classList.toggle("on",k===focus));
          scr.querySelector(".cta").innerHTML=`${PLUS} Metti ${last(CARDS[focus].n)} nel quintetto`;
        }
      });
    },{passive:true});
  }
  if(struct==="C"){
    scr.querySelectorAll(".c-row").forEach(r=>r.onclick=()=>{focus=+r.dataset.i;render();});
  }
}

document.querySelectorAll(".mkbar button").forEach(b=>{
  b.onclick=()=>{struct=b.dataset.s; focus=0;
    document.querySelectorAll(".mkbar button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    render();};
});
render();
</script>
</body>
</html>
